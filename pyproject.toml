[project]
name = "mlops-framework"
version = "1.0.0"
description = "A reusable MLOps Framework for managing datasets, training runs, and model lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "minhquang1604", email = "caominhquang1604@gmail.com" }
]
keywords = ["mlops", "machine-learning", "data-pipeline", "training", "ml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "mlflow>=2.20.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "boto3>=1.34.0",
    "croniter>=2.0.0",
]

[project.optional-dependencies]
slack = [
    # Only needed by approval/slack.py. Kept out of the core dependencies
    # because a framework that cannot be installed without a Slack client
    # would be making a channel choice on its user's behalf.
    "slack-sdk>=3.27.0",
]

dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    # Coverage was never measured, so "is this covered" could only be
    # answered by reading. `pytest --cov=mlops_framework` now answers it.
    "pytest-cov>=4.1.0",
    # Several tests drive real subprocesses, a real local MLflow store
    # and (when reachable) real Airflow. A hang in one of those had no
    # bound and simply stalled the run — in CI, until the job's own
    # 6-hour ceiling. See the timeout in [tool.pytest.ini_options].
    "pytest-timeout>=2.2.0",
    "ruff>=0.1.0",
    "httpx>=0.25.0",
]
# Builds the hosted documentation site (docs-site/, mkdocs.yml) — kept
# out of `dev` since neither pytest nor CI needs it; only a docs edit or
# the gh-pages deploy workflow does. See docs-site/README.md.
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "UP042", # str+Enum -> enum.StrEnum: changes str(member) from "Cls.MEMBER"
             # to the bare value, a real behavior change for anything that
             # logs/serializes these enums today — needs its own reviewed
             # change, not a lint sweep.
]

[tool.ruff.lint.per-file-ignores]
# Each entry below is a rule that is *wrong* for this file, not a rule
# nobody got round to satisfying. CI lints the whole repository, so a
# deliberate pattern has to be declared here rather than left to
# accumulate as noise that trains everyone to ignore the output.

# The imports here must come after the sys.path insertion above them,
# which is the whole reason this file can find the package at all.
# (F401 used to be ignored here too, for a hand-maintained list of
# thirteen model imports that looked unused and were load-bearing. That
# list now lives in one place — see the models package docstring — so a
# single noqa'd import covers it and the file is otherwise clean.)
"alembic/env.py" = ["E402"]

# Repo-root and scripts/ entry points prepend the project root to
# sys.path before importing mlops_framework, so the framework is
# importable when run as a plain script rather than an installed
# package. The imports cannot precede the code that makes them work.
"seed_demo.py" = ["E402"]
"scripts/*.py" = ["E402"]

# Test modules routinely bind a value purely to assert that producing
# it does not raise, and `pytest.importorskip` has to run before the
# imports it guards.
"tests/**/*.py" = ["E402"]
"case_studies/**/tests/*.py" = ["E402"]


[tool.ruff.lint.isort]
known-first-party = ["mlops_framework", "demo", "case_studies"]

[tool.pytest.ini_options]
testpaths = ["tests", "case_studies"]
asyncio_mode = "auto"
# A per-test ceiling, not a suite one — the point is to name the test
# that hung, which a job-level timeout cannot do. Generous on purpose:
# the slowest honest tests here spawn a real training subprocess and
# initialise a real MLflow store, which takes tens of seconds on a cold
# cache. Anything past 300s is stuck, not slow. Override per test with
# @pytest.mark.timeout(n).
timeout = 300
